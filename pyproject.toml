[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfer"
version = "0.1.0"
description = "Facial Emotion Recognition using Deep Learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "streamlit>=1.30.0",
    "tensorflow>=2.15.0,<2.19.0",
]
